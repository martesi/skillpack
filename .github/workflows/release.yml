name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: VITE_BASE=/ bun run build
      - run: tar -C dist -czf "skillpack-${GITHUB_REF_NAME}.tar.gz" .
      - run: gh release create "$GITHUB_REF_NAME" "skillpack-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
